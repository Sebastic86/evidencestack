server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the built 404 page, with the 404 status preserved
    error_page 404 /404.html;

    # Security headers.
    #
    # `always` on every one: without it nginx emits add_header only on 2xx/3xx,
    # so the 404 above — and any 5xx — would go out unprotected.
    #
    # nginx REPLACES inherited add_header directives rather than merging them:
    # a location that sets any add_header loses every server-level one. All
    # three locations below set Cache-Control, so this block is repeated in
    # each of them. Four copies, kept identical — edit them together.
    #
    # The CSP is derived from the actual build output in dist/, not assumed:
    #   script-src  'self'    islands load /_astro/*.js via dynamic import
    #               'unsafe-inline'  Astro emits two inline <script> blocks
    #                                (its island runtime) on all 23 island pages
    #   style-src   'self'    /_astro/*.css
    #               'unsafe-inline'  Astro scoped <style> blocks, plus ~2100
    #                                inline style="" attributes from the islands
    #   img-src     data:     the inline SVG favicon
    #   font-src    'self'    self-hosted woff/woff2 under /_astro/
    #               data:     some faces are base64-inlined into the CSS
    #   form-action buttondown.com  the newsletter form POSTs cross-origin
    # No third-party scripts, iframes, or fetch()/XHR exist anywhere in the
    # output, hence connect-src 'self', object-src 'none', frame-ancestors 'none'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=(), xr-spatial-tracking=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://buttondown.com; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated from the server block — see the note there
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://buttondown.com; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # JSON API: short cache so regrades propagate
    location /api/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        # Repeated from the server block — see the note there
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://buttondown.com; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html =404;
    }

    location / {
        add_header Cache-Control "public, max-age=600";
        # Repeated from the server block — see the note there
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://buttondown.com; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html =404;
    }
}

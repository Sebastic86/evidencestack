name: Collagen peptides
synonyms: [hydrolyzed collagen, collagen hydrolysate]
forms: "hydrolyzed peptides, bovine or marine"
cats: [other, joint]
blurb: >-
  Hydrolyzed protein from skin and bone. The trials are numerous and positive, and
  nearly every one of them is funded by a peptide manufacturer — the funding column
  is the reason the grades stop where they do.
typicalDose: "2.5–15 g/day"
studiedDose: "2.5–15 g/day"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 2500
  studiedMaxMg: 15000
claims:
  - outcome: skin elasticity & hydration
    cat: other
    grade: B
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Proksch et al.
        year: 2014
        url: https://doi.org/10.1159/000351376
        species: human
        design: RCT, double-blind
        n: 69
        duration: 8 weeks
        dose: 2.5 or 5 g/day
        funding: not-declared
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23949208&resultType=core&format=json"
            note: >-
              Abstract: "In this double-blind, placebo-controlled trial, 69 women
              aged 35-55 years were randomized to receive 2.5 g or 5.0 g of CH or
              placebo once daily for 8 weeks, with 23 subjects being allocated to
              each treatment group." Randomisation is stated explicitly, so the
              RCT label holds. Both this and the funding check now rest on the
              same complete full text, recovered from the publisher's own
              archived PDF after the live Karger page refused every route.
          funding:
            on: 2026-08-31
            outcome: corrected
            basis: absence
            source: "https://web.archive.org/web/20160303030120id_/http://www.karger.com:80/Article/Pdf/351376"
            note: >-
              Corrected industry → not-declared. The complete paper was read
              this time, from the publisher's own archived PDF, and it declares
              no funding: "funding", "funded", "grant", "financial",
              "acknowledgement", "disclosure", "conflict", "competing",
              "sponsor" and "declaration" appear nowhere in it, and the
              Discussion runs straight into the References with no end matter.
              The one industry link the paper does state is material support,
              not funding: "The product was provided by GELITA AG (Eberbach,
              Germany), commercially available under the name VERISOL®." That is
              the same shape as Cardax supplying the compound in the astaxanthin
              ITP records, which is recorded there as a competing interest while
              funding stays what the paper declares — so the same rule is
              applied here. Two authors give their affiliation as CRI, Collagen
              Research Institute, but affiliation is not funding and was
              deliberately not used to set this field. The claim above still
              carries an industry-funded flag; that flag is now the only thing
              asserting industry money on this study, and it is a human's call.
        outcome: skin elasticity measurements
        note: >-
          Measurable elasticity improvement, replicated in later
          manufacturer-funded trials. Consistent enough for B; independent
          replication would settle it.
  - outcome: activity-related joint pain
    cat: joint
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Clark et al.
        year: 2008
        url: https://doi.org/10.1185/030079908X291967
        species: human
        design: RCT, double-blind, placebo-controlled
        n: 147
        duration: 24 weeks
        dose: 10 g/day collagen hydrolysate (CH-Alpha) in 25 mL liquid
        funding: not-declared
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:18416885&resultType=core&format=json"
            note: >-
              Abstract Design and setting: "A prospective, randomized,
              placebo-controlled, double-blind study was conducted at Penn State
              University." Intervention: "One hundred and forty-seven subjects
              (72 male, 75 female) were randomly assigned to two groups." Both
              sentences state randomisation, so the RCT label holds. Design only
              — the funding statement is still unreachable on this record.
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              No funding statement reached, so the existing value stands
              unverified. Unpaywall, Semantic Scholar and OpenAlex all return
              closed with no open copy anywhere; the Taylor & Francis page
              serves no article text and its Wayback snapshot returns 403;
              there is no PubMed Central record. This claim carries an
              industry-funded flag over a study whose funding nobody has been
              able to read, which remains an open disagreement for a human.
        outcome: visual-analogue joint pain, mobility and inflammation in athletes with no joint disease
        note: >-
          The only trial run in exactly this population — varsity and club
          athletes, not patients. Six pain measures moved further than placebo,
          all by well under one point on a ten-point scale, and five of the six
          were rated by the participants themselves. Only 97 of the 147
          randomised subjects could be evaluated, which is a large loss. The
          larger differences the paper highlights come from a subgroup of 63
          with knee pain, not the whole sample. The tested product is a named
          brand, CH-Alpha; the full text is paywalled with no open copy, so
          funding could not be verified past the abstract.
      - cite: Liang et al.
        year: 2024
        url: https://doi.org/10.1016/j.joca.2023.12.010
        species: human
        design: trial-sequential meta-analysis of 35 RCTs
        n: 3165
        duration: not stated in the abstract
        dose: not stated in the abstract
        funding: not-declared
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:38218227&resultType=core&format=json"
            note: >-
              Abstract Design: databases were "searched till June 2023 for
              randomized controlled trials (RCTs) investigating collagen
              derivatives for treating osteoarthritis", and Results: "A total of
              35 RCTs involving 3165 patients were included." Both the count and
              the trial-sequential meta-analysis framing match the record.
              Design only — the funding statement is still unreachable.
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              No funding statement reached, so the existing value stands
              unverified. Unpaywall lists a bronze open-access PDF at
              oarsijournal.com, but that link and every variant of it redirect
              into Elsevier's bot protection and return no document; there is
              no PubMed Central record, and the abstract contains no funding or
              registration text.
        outcome: osteoarthritis pain and physical function
        note: >-
          Much larger and more rigorous, but in osteoarthritis patients rather
          than active people without joint disease. Pain fell by a standardised
          mean difference of −0.35 at moderate certainty, from 25 of the 35
          trials (2856 of the 3165 patients); function improved by −0.31 at high
          certainty. Listed here because it is the best evidence that oral
          collagen does anything to a joint at all; the population is not the one
          this claim is about. The full text is behind the publisher's bot
          protection, so funding could not be verified past the abstract.

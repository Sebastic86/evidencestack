name: Glutathione
synonyms: [GSH, reduced glutathione, liposomal glutathione]
forms: "reduced · liposomal · S-acetyl"
cats: [other, metabolic]
blurb: >-
  The body's main intracellular antioxidant — which your gut largely digests when
  you swallow it. The interesting question is whether any oral form meaningfully
  raises levels at all.
typicalDose: "250–1000 mg/day"
studiedDose: "250–1000 mg/day"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
claims:
  - outcome: raising body glutathione stores
    cat: metabolic
    grade: C
    effect: unclear
    species: human-rct
    flags: [biomarker-only, industry-funded]
    studies:
      - cite: Richie et al.
        year: 2015
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://link.springer.com/article/10.1007/s00394-014-0706-z
            note: >-
              "Methods: A 6-month randomized, double-blinded, placebo-controlled
              trial of oral GSH (250 or 1,000 mg/day) on GSH levels in blood,
              erythrocytes, plasma, lymphocytes and exfoliated buccal mucosal
              cells was conducted in 54 non-smoking adults." Randomised and
              double-blind as recorded. The record's design omits
              placebo-controlled, which the paper states; not wrong, just less
              specific, and left alone. Read from the publisher's landing page;
              the full text is paywalled, so the methods section itself was not
              read.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://link.springer.com/article/10.1007/s00394-014-0706-z
            note: >-
              "This work was supported by Kyowa Hakko Bio Co., Ltd (JR).
              Glutathione (Setria®) supplements and placebo were provided by
              Kyowa Hakko Bio Co., Ltd." The declared interest reads "JPR
              received research support for this study and travel funds to
              present previous research findings from Kyowa Hakko Bio Co., Ltd.
              Kyowa Hakko Bio Co., Ltd is a biotechnology and fermentation
              company that provides glutathione (Setria®)." The manufacturer
              funded the trial and supplied the product. The same acknowledgment
              adds that "Immunological analyses were supported in part by the
              Penn State Hershey Cancer Institute through the Clinical
              Correlative Immunology Laboratory", which is an argument for
              mixed; industry was kept because that covers one set of assays,
              not the trial. Read from the publisher's landing page, which
              carries the back matter — the full text itself is paywalled and
              was not read.
        url: https://doi.org/10.1007/s00394-014-0706-z
        species: human
        design: RCT, double-blind
        n: 54
        duration: 6 months
        dose: 250 or 1000 mg/day
        funding: industry
        outcome: blood and cell glutathione levels
        note: >-
          Levels rose 30–35% at the high dose after months — contradicting an
          earlier null trial. Bioavailability is genuinely contested; nothing here
          touches a clinical outcome.
  - outcome: skin brightening
    cat: other
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded, biomarker-only]
    studies:
      - cite: Arjinpathana & Asawanonda
        year: 2012
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.tandfonline.com/doi/full/10.3109/09546631003801619
            note: >-
              "Methods: This randomized, double-blind, two-arm,
              placebo-controlled study was set in the King Chulalongkorn
              Memorial Hospital, Bangkok, Thailand", and "Sixty otherwise
              healthy medical students were randomized to receive either
              glutathione capsules, 500 mg/day in two divided doses, or placebo
              for 4 weeks." Randomised, double-blind and placebo-controlled as
              recorded. Read from the publisher's landing page; the full text is
              paywalled, so the methods section itself was not read and the
              randomisation method is not known.
          funding:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: https://www.tandfonline.com/doi/full/10.3109/09546631003801619
            note: >-
              not-declared → industry. "This study was supported in part by JSP
              Pharmaceuticals, Bangkok, Thailand. The sponsors had no role in
              the design and conduct of the study; in the collection, analysis,
              and interpretation of data; or in the preparation, review, or
              approval of the manuscript." A pharmaceutical company supported a
              trial of the compound it sells, and the record read not-declared.
              The paper separately states "Declaration of interest: The authors
              report no conflicts of interest." Read from the publisher's
              landing page, which carries the acknowledgment and declaration —
              the full text itself is paywalled and was not read, so the
              registry status of this trial is still unchecked.
        url: https://doi.org/10.3109/09546631003801619
        species: human
        design: RCT, double-blind, placebo-controlled
        n: 60
        duration: 4 weeks
        dose: 500 mg/day in two divided doses
        funding: industry
        outcome: mean reduction in melanin index at six skin sites (primary); UV spots and other secondary outcomes recorded by VISIA imaging
        note: >-
          Melanin index fell at all six measured sites, but the reduction beat
          placebo at only two of them — the right side of the face and the
          sun-exposed left forearm (p = 0.021 and 0.036). Sixty medical students
          over four weeks, all of whom completed, measuring skin colour with
          instruments rather than anything a person would notice. The full text
          is paywalled, but the publisher's landing page carries the back
          matter: the study was supported in part by JSP Pharmaceuticals,
          Bangkok, Thailand, and the authors report no conflicts of interest.

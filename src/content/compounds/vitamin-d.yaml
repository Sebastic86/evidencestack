name: Vitamin D
synonyms: [cholecalciferol, D3, calcifediol]
forms: "D3 (cholecalciferol) · D2"
cats: [other, cardiovascular]
blurb: >-
  The most-tested supplement of the last decade. Correcting a deficiency clearly
  matters; giving it to people who aren't deficient has now failed in several of the
  largest trials ever run on a supplement.
typicalDose: "1000–2000 IU/day"
studiedDose: "400–4000 IU/day"
ul: "4000 IU/day (100 µg) for adults"
caution: >-
  Fat-soluble and accumulates; sustained intakes above the UL can cause
  hypercalcemia. Blood testing is cheap — deficiency, not dose, is the question.
reviewed: 2026-08-30
reviewer: "draft — unverified"
claims:
  - outcome: correcting measured deficiency
    cat: other
    grade: A
    effect: large
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Gallagher et al.
        year: 2012
        url: https://doi.org/10.7326/0003-4819-156-6-201203200-00005
        species: human
        design: RCT, placebo-controlled, eight dose arms
        n: 163
        duration: 1 year
        dose: "400, 800, 1600, 2400, 3200, 4000 or 4800 IU/day vitamin D3, or placebo"
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: 'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI%3A%2210.7326%2F0003-4819-156-6-201203200-00005%22&resultType=core&format=json'
            note: >-
              The structured abstract carries it outright: "Primary funding
              source: National Institute on Aging." Publisher-deposited grant
              metadata names the award, R01-AG28168, NIA NIH HHS. The same
              abstract confirms the registry ID already on this record —
              "(ClinicalTrials.gov registration number: NCT00472823)". The full
              text at Annals was not retrieved, so a second, unnamed funder
              cannot be ruled out, but the declared primary source is
              government.
        registry: NCT00472823
        outcome: serum 25-hydroxyvitamin D and parathyroid hormone at 6 and 12 months
        note: >-
          Postmenopausal white women at one US centre, starting at a mean 25(OH)D
          of 39 nmol/L and all given enough calcium to reach 1200–1400 mg a day.
          800 IU a day brought 97.5% of them above 50 nmol/L, and the
          dose-response curve flattens above about 3200 IU — though the authors'
          own model predicts 600 IU would do the same job. This is what the A
          grade rests on: giving vitamin D to a deficient person reliably fixes
          the blood level. It says nothing about how they then feel, which is
          what the biomarker-only flag is for. Depending on the criterion used,
          hypercalciuria occurred in 12–33% and hypercalcemia in 2.8–9.0% of
          participants, neither related to dose. The authors caution that the
          findings may not generalise to other age groups or to people with
          substantial comorbid conditions.
  - outcome: preventing cancer & cardiovascular disease in non-deficient adults
    cat: cardiovascular
    grade: E
    effect: negligible
    species: human-rct
    flags: []
    studies:
      - cite: Manson et al. (VITAL)
        year: 2019
        url: https://doi.org/10.1056/NEJMoa1809944
        species: human
        design: RCT, double-blind
        n: 25871
        duration: 5.3 years median
        dose: 2000 IU/day
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=6425757&retmode=xml'
            note: >-
              "Funding/Support: VITAL was supported by grants U01 CA138962 and
              R01 CA138962, which included support from the National Cancer
              Institute, National Heart, Lung and Blood Institute, Office of
              Dietary Supplements, National Institute of Neurological Disorders
              and Stroke, and the National Center for Complementary and
              Integrative Health." The donation is real and immediately follows:
              "Pharmavite LLC of Northridge, California (vitamin D) and Pronova
              BioPharma of Norway and BASF (Omacor fish oil) donated the study
              agents, matching placebos, and packaging in the form of calendar
              packs. Quest Diagnostics (San Juan Capistrano, CA) measured serum
              25-hydroxyvitamin D at no cost to the study." Product and a free
              assay, no company money and no company role — the Role of the
              Sponsor paragraph names only the NIH. Donation without funding
              stays public, consistent with the earlier call; note that Quest's
              free measurement is an in-kind service rather than product, and
              contrast ASCEND on omega-3, where the companies did pay for
              packaging and that record reads mixed.
        registry: NCT01169259
        outcome: invasive cancer, major cardiovascular events
        note: >-
          No effect on either primary endpoint in a generally replete population.
          Tested at scale, found not to work — for this claim. NIH grants paid
          for the trial, but two commercial contributions are worth knowing:
          Pharmavite donated the vitamin D, the matching placebo and the
          packaging, and Quest Diagnostics measured the participants' serum
          25-hydroxyvitamin D at no cost to the study. Donated product and a
          donated assay are not company money, and the funding field reads
          public on that basis — but a commercial laboratory running the trial's
          own blood measurements for free is a fact a reader should have.
  - outcome: fracture prevention in deficient or institutionalised elderly (with calcium)
    cat: other
    grade: B
    effect: small
    species: human-rct
    flags: []
    studies:
      - cite: Chapuy et al. (Decalyos)
        year: 1992
        url: https://doi.org/10.1056/NEJM199212033272305
        species: human
        design: RCT, double-placebo
        n: 3270
        duration: 18 months
        dose: 1.2 g elemental calcium + 800 IU (20 µg) vitamin D3 daily
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: corrected
            source: 'https://web.archive.org/web/20160612064920id_/http://www.nejm.org/doi/full/10.1056/NEJM199212033272305'
            note: >-
              Was not-declared, on the grounds that the paper is an image-only
              scan. It is, at NEJM today — but an archived copy of NEJM's own
              HTML full text is machine-readable and carries the statement:
              "Supported by a grant from the Caisse Nationale d'Assurance Maladie
              des Travailleurs Salariés—INSERM and the Ministère de la Recherche
              et de l'Enseignement Supérieur-Aliment 2000. Duphar and Company
              Laboratories provided the vitamin D3 (Devaron) and Merck—Clevenot
              Laboratories the tricalcium phosphate (Ostram)." The national
              health-insurance fund, INSERM and the research ministry are all
              public; the two companies supplied product and are not described as
              paying for anything, which is the same donation-without-funding
              pattern as VITAL above. The record's own note still says funding
              could not be verified past the abstract; that sentence is now
              stale. The same text also settles a question 3b left open — it
              thanks "all the physicians working in the 180 nursing homes", so
              the nursing-home population that pass deleted as unsupportable is
              in fact in the paper.
        outcome: radiologically confirmed hip and other nonvertebral fractures
        note: >-
          3270 healthy ambulatory women, mean age 84. Hip fractures were 43%
          lower (p = 0.043) and all nonvertebral fractures 32% lower (p = 0.015)
          than placebo, with intention-to-treat and completer analyses agreeing.
          Serum 25(OH)D rose 162% and parathyroid hormone fell 44%, and proximal
          femur bone density rose 2.7% against a 4.6% fall on placebo — mechanism
          and outcome agree, and a 162% rise is itself the signature of a
          corrected deficiency rather than topping up the replete. NEJM serves
          this paper today only as an image scan with no machine-readable text,
          but an archived copy of NEJM's own HTML full text is readable, and it
          settles two things earlier passes had to leave open. The population
          was institutional: the paper thanks "all the physicians working in the
          180 nursing homes" who cooperated, so the nursing-home detail a
          previous review removed as unsupported is in the paper after all. And
          the funding is stated — a grant from the French national health
          insurance fund with INSERM and the research ministry, with Duphar
          supplying the vitamin D3 and Merck—Clevenot the tricalcium phosphate.

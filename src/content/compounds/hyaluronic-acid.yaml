name: Hyaluronic acid
synonyms: [sodium hyaluronate, HA]
forms: "oral, mixed molecular weights"
cats: [joint, other]
blurb: >-
  Famous as an injectable and a skincare ingredient; the oral supplement question is
  whether swallowing it does anything. Trials exist, are positive, and are almost
  entirely run by the companies selling it.
typicalDose: "120–240 mg/day"
studiedDose: "120–240 mg/day"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
claims:
  - outcome: skin hydration & wrinkle depth
    cat: other
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Oe et al.
        year: 2017
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5522662/fullTextXML
            note: >-
              "Clinical trial design. This study was conducted by Kewpie
              Corporation, who carried out a randomized, double-blind,
              placebo-controlled trial." The method is given: "Subjects were
              randomly assigned to either the HA 2k, HA 300k, or placebo group
              before starting the study according to stratified randomization
              based on age by the study coordinator", with allocation
              "documented in an electronic file accessible only to the study
              coordinator" and the investigators handing out samples "who did
              not know the allocation". Randomised and double-blind as recorded.
              Note it is a three-arm trial — two hyaluronan molecular weights
              plus placebo — which the design string does not say.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5522662/fullTextXML
            note: >-
              "This study was funded by the Kewpie Corporation." The disclosure
              adds that six of the seven authors "are employees of Kewpie
              Coroporation" (the paper's spelling). Registry JMA-IIA00234
              verified in the full text.
        url: https://doi.org/10.2147/CCID.S141845
        species: human
        design: RCT, double-blind
        n: 60
        duration: 12 weeks
        dose: 120 mg/day
        funding: industry
        registry: JMA-IIA00234
        outcome: skin wrinkle measurements, questionnaires
        note: >-
          Modest improvement vs placebo, funded and run by a hyaluronan
          manufacturer — a pattern this claim repeats across nearly every trial.
  - outcome: knee joint pain
    cat: joint
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Tashiro et al.
        year: 2012
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3512263/fullTextXML
            note: >-
              "Study Design. The study was conducted as a randomised
              double-blind placebo-controlled trial", and "The 60 subjects
              enrolled in the study were assigned to either the HA or the
              placebo group, each consisting of 30 subjects by means of
              stratified randomisation to equalize age, sex ratio, and K/L grade
              between the groups." Randomised, double-blind and
              placebo-controlled as recorded, read in the complete open-access
              text. Design is sound; what the record's own note already
              documents is that 22 of the 60 randomised were dropped before
              analysis, which is an attrition problem rather than a design one.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: absence
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3512263/fullTextXML
            note: >-
              Confirmed by absence, against the complete open-access full text
              rather than a rendered extract. A sweep of the raw XML for
              funding-group, financial-disclosure and COI-statement elements
              returned nothing, and a keyword sweep of the article text for
              fund, grant, conflict, competing, sponsor, financial and
              disclosure returned exactly one sentence, an unrelated remark
              about glucosamine. The paper declares no funding and no conflicts.
              No trial registry ID appears anywhere in it. The Kewpie
              affiliation recorded in the note is an affiliation, not a declared
              funding source.
        url: https://doi.org/10.1100/2012/167928
        species: human
        design: RCT, double-blind, placebo-controlled
        n: 60
        duration: 12 months
        dose: 200 mg/day oral polymer hyaluronic acid
        funding: not-declared
        outcome: Japanese Knee Osteoarthritis Measure symptom score
        note: >-
          Unusually long for this literature at a full year, and both groups also
          did quadriceps strengthening — symptoms improved on placebo too. Across
          all participants the total score never separated from placebo at any
          timepoint; the hyaluronic acid group scored better only at 2 and 4
          months, and only in the 21 participants aged 70 or under. One of the
          four subscales, "health conditions", did stay lower throughout. That is
          a subgroup at two timepoints, not a durable effect. Twenty-two of the
          60 randomised were dropped before analysis, leaving 18 on hyaluronic
          acid and 20 on placebo. The paper carries no funding or
          conflict-of-interest statement at all, but four of its six authors
          worked in the R&D division of Kewpie Corporation, which manufactured the
          hyaluronic acid tested.

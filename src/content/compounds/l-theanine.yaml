name: L-theanine
synonyms: [theanine]
forms: "free amino acid, from tea or synthesis"
cats: [cognition, sleep]
blurb: >-
  The amino acid that makes tea calming without sedation. Small trials support a
  take-the-edge-off effect, especially paired with caffeine; nothing here is large.
typicalDose: "100–400 mg/day"
studiedDose: "200–400 mg/day"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 200
  studiedMaxMg: 400
claims:
  - outcome: acute stress & anxiety reduction
    cat: cognition
    grade: C
    effect: small
    species: human-rct
    flags: []
    studies:
      - cite: Hidese et al.
        year: 2019
        url: https://doi.org/10.3390/nu11102362
        species: human
        design: RCT, double-blind crossover
        n: 30
        duration: 4 weeks
        dose: 200 mg/day
        funding: industry
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6836118/fullTextXML'
            note: >-
              Funding: "This study was supported by funding received from Taiyo
              Kagaku Co., Ltd., Mie, Japan." Conflicts of Interest: "Yasukawa Z.
              and Ozeki M. are employees of Taiyo Kagaku Co., Ltd. which
              supplied the L-theanine and placebo tablets used in this trial."
              Both read from the full text, not from metadata. Recorded but not
              adopted: the UMIN record (R000032739) lists the funding source as
              an NCNP intramural research grant AND an unrestricted grant from
              Taiyo Kagaku, which would read as mixed — but the paper itself
              declares only Taiyo Kagaku, and the registry classifies its own
              funding organisation as a profit organisation. The printed
              statement governs.
        registry: UMIN000028603
        outcome: stress and sleep questionnaires
        note: >-
          Lower stress scores and better sleep ratings — small sample, subjective
          endpoints, manufacturer involvement.
  - outcome: attention, combined with caffeine
    cat: cognition
    grade: C
    effect: small
    species: human-rct
    flags: []
    studies:
      - cite: Nawarathna et al.
        year: 2025
        url: https://doi.org/10.1017/S0007114525104169
        species: human
        design: RCT, double-blind, placebo-controlled two-way crossover
        n: 37
        duration: acute — measured 50 minutes after a single dose
        dose: 200 mg L-theanine with 160 mg caffeine
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: 'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12491391/fullTextXML'
            note: >-
              Acknowledgments: "This work was supported by the University of
              Peradeniya Research Grant (URG/2023/13/D) and Ekhagastiftelsen
              Foundation grant (2023-142)." The same section states "The
              author(s) declare no conflicts of interest." Read from the full
              text. Defensible but not pure, and recorded so it stays checkable:
              the university grant is public, while Ekhagastiftelsen is a
              private Swedish philanthropic foundation — no manufacturer of
              theanine or caffeine is involved either way. Same shape as the
              Harrison 2024 public/philanthropy call.
        registry: SLCTR/2023/006
        outcome: hit rate and target-distractor discriminability on a visual attention task, plus P3b event-related potentials
        note: >-
          Hit rate, discriminability and reaction time all moved further than
          placebo, with matching changes in the brain's electrical response.
          Thirty-seven people, one dose, one sitting — and all of them were
          deliberately sleep-deprived, so this does not describe a rested user.
          The trial had two arms, the combination against placebo, with no
          theanine-alone and no caffeine-alone arm, so nothing in it separates
          theanine's contribution from caffeine's.
history: []

name: Berberine
synonyms: [berberine HCl]
forms: "HCl · phytosome"
cats: [metabolic, cardiovascular]
blurb: >-
  A plant alkaloid with real glucose-lowering pharmacology, hyped as "nature's
  metformin." Many trials, mostly small and of mixed quality; the effect on blood
  sugar is consistent, the long-term outcome data absent.
typicalDose: "900–1500 mg/day, divided"
studiedDose: "900–1500 mg/day"
ul: none established
caution: >-
  GI side effects are common. Inhibits CYP3A4/2D6 — interacts with many
  prescription drugs, and should not be combined with other glucose-lowering
  medication without medical supervision. Avoid in pregnancy.
hype: true
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 900
  studiedMaxMg: 1500
claims:
  - outcome: glycemic control in type 2 diabetes
    cat: metabolic
    grade: B
    effect: moderate
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Lan et al.
        year: 2015
        url: https://doi.org/10.1016/j.jep.2014.09.049
        species: human
        design: meta-analysis of 27 RCTs
        n: 2569
        duration: mixed
        dose: mostly 900–1500 mg/day
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://api.crossref.org/works/10.1016/j.jep.2014.09.049
            note: >-
              No funding sentence was read. The full text is paywalled and no
              open copy exists. This rests entirely on publisher-deposited
              funder metadata, which names six Chinese provincial and municipal
              bodies: Natural Science Foundation of Zhejiang Province
              (LY14H270001), Zhejiang Province Chinese Medicine Scientific
              Research Fund (2013ZB121), Wenzhou Science & Technology Bureau
              (Y20100222), Wenzhou Municipal Health Bureau (2010A012), Wenzhou
              Municipal 551 Talented Grant, and Wenzhou Traditional Chinese
              Medicine Laboratory Center. Europe PMC's grant list is identical.
              Deposited metadata is a weaker source than a statement in the
              paper: it records who is named, not what the authors declared.
        outcome: HbA1c, fasting glucose, lipids
        note: >-
          HbA1c reductions approaching oral antidiabetic drugs — from mostly
          small Chinese trials of variable quality. Consistent direction, weak
          individual trials: textbook B with an asterisk.
  - outcome: LDL cholesterol lowering
    cat: cardiovascular
    grade: B
    effect: small
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Ju et al.
        year: 2018
        url: https://doi.org/10.1016/j.phymed.2018.09.212
        species: human
        design: meta-analysis of 16 RCTs
        n: 2147
        duration: not stated in the abstract
        dose: not stated in the abstract
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://api.crossref.org/works/10.1016/j.phymed.2018.09.212
            note: >-
              No funding sentence was read. The full text is paywalled and no
              open copy exists. This rests entirely on publisher-deposited
              funder metadata, which names the National Clinical Research Centre
              of Traditional Chinese Medicine (JDZX2015263) and Capital's Funds
              for Health Improvement and Research (2018-1-4171). Europe PMC's
              grant list is identical. Deposited metadata is a weaker source
              than a statement in the paper: it records who is named, not what
              the authors declared.
        outcome: LDL cholesterol, total cholesterol, triglycerides, HDL cholesterol, adverse events
        note: >-
          LDL cholesterol fell by 0.38 mmol/l (95% CI −0.53 to −0.22). The
          authors themselves rate the included trials as high risk of bias on
          randomisation, allocation concealment and blinding, and flag high
          clinical heterogeneity — a consistent direction resting on weak
          individual trials. The full text is paywalled; the two named funders,
          the National Clinical Research Centre of Traditional Chinese Medicine
          and Capital's Funds for Health Improvement and Research, come from the
          publisher's deposited grant record rather than from a funding
          statement we could read.
history: []

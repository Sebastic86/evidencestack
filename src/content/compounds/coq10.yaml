name: CoQ10
synonyms: [coenzyme Q10, ubiquinone, ubiquinol]
forms: "ubiquinone · ubiquinol"
cats: [cardiovascular, muscle]
blurb: >-
  A mitochondrial electron carrier that declines with age and with statin use. One
  solid trial in heart failure; a long argument about statin muscle pain.
typicalDose: "100–300 mg/day"
studiedDose: "100–300 mg/day"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 100
  studiedMaxMg: 300
claims:
  - outcome: outcomes in chronic heart failure (adjunct)
    cat: cardiovascular
    grade: B
    effect: moderate
    species: human-rct
    flags: [industry-funded, under-review]
    studies:
      - cite: Mortensen et al. (Q-SYMBIO)
        year: 2014
        url: https://doi.org/10.1016/j.jchf.2014.06.008
        species: human
        design: RCT, double-blind
        n: 420
        duration: 2 years
        dose: 300 mg/day
        funding: industry
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: "https://www.isrctn.com/api/query/format/who?q=ISRCTN94506234"
            note: >-
              No funding sentence in the paper was read — the full text is
              behind Elsevier's bot protection and the bronze open-access PDF
              returns 403. This rests on the trial's own ISRCTN registry record,
              whose sources-of-support line reads "Pharma Nord ApS (Denmark),
              International Coenzyme Q10 Association (Italy), Kaneka Corporation
              of Osaka (Japan)" — Pharma Nord and Kaneka both sell CoQ10.
              Crossref and Europe PMC independently deposit Kaneka Corp. and the
              International Coenzyme Q10 Association as funders. The same
              registry record confirms ISRCTN94506234 belongs to Q-SYMBIO by
              title, which matters: this record previously carried NCT00374465,
              a real ID belonging to an unrelated heart-failure trial.
        registry: ISRCTN94506234
        outcome: major adverse cardiovascular events, mortality
        note: >-
          Halved cardiovascular mortality as an add-on to standard therapy — a
          striking result from a modest trial that has not been independently
          replicated at scale.
  - outcome: statin-associated muscle pain
    cat: muscle
    grade: C
    effect: unclear
    species: human-rct
    flags: []
    studies:
      - cite: Kovacic et al.
        year: 2025
        url: https://doi.org/10.1017/jns.2025.10043
        species: human
        design: meta-analysis of 7 RCTs
        n: 389
        duration: 30–90 days
        dose: "100–600 mg/day"
        funding: mixed
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12554813/fullTextXML
            note: >-
              Financial statement read in full text: "Financial support was
              provided by the Society for Applied Vitamin Research (GVF, Jena,
              Germany)", with "The authors declare no conflict of interest."
              Funding was declared, so not-declared would be wrong; the sole
              funder is a scientific society, so neither public nor a named
              manufacturer fits. Moving it to industry would require inferring
              GVF's character from its corporate membership, which is the kind
              of inference this register exists to avoid. Mixed is the
              least-wrong value the enum allows, and this reviews the call left
              open in TODO item 3b. The registration was read in the same text:
              "registered on the PROSPERO register (registration number
              CRD42023467604)."
        registry: PROSPERO CRD42023467604
        outcome: statin-associated muscle symptoms, measured as pain intensity
        note: >-
          Pain intensity fell by a weighted mean difference of −0.96, with the
          confidence interval reaching −0.03 — statistically significant, barely.
          Four of the seven trials found a reduction and three found none, and
          heterogeneity is extreme (I² = 93.3%). The subgroup that matters most
          here is the inconvenient one: in the trials that actually required
          statin-associated muscle symptoms for entry, the pooled effect was not
          significant (−0.94, 95% CI −2.65 to 0.79); the significant overall
          result comes from trials that did not select for those symptoms.
          Funding was declared as "the Society for Applied Vitamin Research (GVF,
          Jena, Germany)", a scientific society rather than a public body or a
          named manufacturer.
      - cite: Kennedy et al.
        year: 2020
        url: https://doi.org/10.1016/j.atherosclerosis.2020.03.006
        species: human
        design: meta-analysis of 7 RCTs
        n: 321
        duration: not stated in the abstract
        dose: not stated in the abstract
        funding: not-declared
        checked:
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              No funding statement reached, so the existing value stands
              unverified. Unpaywall and Semantic Scholar both report this as a
              CC-BY hybrid open-access paper, but every route to the text —
              the DOI, the journal's own article and PDF URLs — redirects into
              Elsevier's bot protection and returns no document. There is no
              PubMed Central record, and Crossref deposits no funder.
              Nominally open and undeliverable in practice.
        outcome: myalgia symptom scores, and whether patients stayed on their statin
        note: >-
          The opposite conclusion from an overlapping trial set: no benefit on
          myalgia (WMD −0.42, CI −1.47 to 0.62) and no effect on statin
          adherence (RR 0.99, CI 0.81 to 1.20). Only two of the eight reviewed
          trials showed a positive effect. Two meta-analyses of the same small
          literature disagree, which is why this claim sits at C. The full text
          is behind the publisher's bot protection, so funding could not be
          verified past the abstract.

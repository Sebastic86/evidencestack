name: NR / NMN
synonyms: [nicotinamide riboside, nicotinamide mononucleotide, NAD+ precursors]
forms: "NR chloride · NMN"
cats: [longevity, metabolic]
blurb: >-
  NAD+ precursors and the flagship compounds of the longevity boom. They reliably
  raise blood NAD+ — and so far that is nearly the whole human story.
typicalDose: "250–1000 mg/day"
studiedDose: "250–2000 mg/day"
ul: none established
hype: true
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 250
  studiedMaxMg: 2000
claims:
  - outcome: raising blood NAD+ levels
    cat: metabolic
    grade: B
    effect: large
    species: human-rct
    flags: [biomarker-only, industry-funded]
    studies:
      - cite: Martens et al.
        year: 2018
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5876407/fullTextXML
            note: >-
              "Here we provide the evidence in a 2 × 6-week randomized,
              double-blind, placebo-controlled, crossover clinical trial that
              chronic supplementation with the NAD+ precursor vitamin,
              nicotinamide riboside (NR), is well tolerated." Sequence
              allocation was itself randomised, which is the specific thing this
              pass set out to check on a crossover: "15 subjects were randomized
              to Group A, which received placebo capsules during the first 6
              weeks of the study before crossing over to receive NR capsules for
              the remaining 6 weeks. The other 15 subjects were randomized to
              Group B, which received NR capsules first followed by placebo."
              Randomised, double-blind and crossover as recorded — not a
              counterbalanced allocation. Registry NCT02921659 was verified
              against this same text last pass.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5876407/fullTextXML
            note: >-
              "This work was supported by NIH grants AG000279 and TR001082 and
              was completed while C.R.M. was a Glenn/AFAR Postdoctoral Fellow.
              Study pills, NR standards for metabolite analyses and partial
              funding support were provided by ChromaDex, Inc." Public money
              plus partial funding and the study product from a company that
              sells nicotinamide riboside, which is what mixed records. The
              paper separately states "Competing interests: The authors declare
              no competing interests." Registry NCT02921659 verified as this
              study's own: "This trial is registered on ClinicalTrials.gov under
              the identifier NCT02921659."
        url: https://doi.org/10.1038/s41467-018-03421-7
        species: human
        design: RCT, double-blind crossover
        n: 24
        duration: 6 weeks
        dose: 1000 mg NR/day
        funding: mixed
        registry: NCT02921659
        outcome: blood NAD+ metabolome, vascular measures
        note: >-
          NAD+ up ~60%, replicated across trials. Raising the biomarker is
          settled; whether raising it does anything for aging humans is not.
  - outcome: healthspan & lifespan extension
    cat: longevity
    grade: D
    effect: moderate
    species: rodent
    flags: [rodent-only]
    studies:
      - cite: Mills et al.
        year: 2016
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC5668137&retmode=xml
            note: >-
              "This work was conducted thoroughly under a sponsored research
              agreement between Washington University and Oriental Yeast Co."
              The same acknowledgment thanks seven named people "in Oriental
              Yeast Co. for their support to this sponsored research project",
              alongside NIH grants R01 AG047902, P30 DK020579 and P30 DK056341,
              which is what mixed records. It also discloses that one author is
              a co-founder of Metro Midwest Biotech and another consults for
              ChromaDex. No registry — this is a mouse study. Europe PMC returns
              an empty body for this PMC id despite listing it as present; NCBI
              efetch serves the full text.
        url: https://doi.org/10.1016/j.cmet.2016.09.013
        species: rodent
        design: controlled long-term study
        n: 80
        duration: 12 months
        dose: 100–300 mg/kg/day NMN
        funding: mixed
        outcome: metabolic decline, physical function in aging mice
        note: >-
          Broad improvements in aging mice. Nobody has tested this endpoint in
          humans, and at these doses nobody soon will.
  - outcome: insulin sensitivity in prediabetic women
    cat: metabolic
    grade: C
    effect: small
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Yoshino et al.
        year: 2021
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC8550608&retmode=xml
            note: >-
              "We conducted a 10-week, randomized, placebo-controlled,
              double-blind trial to evaluate the effect of NMN supplementation
              on metabolic function in postmenopausal women with prediabetes who
              were overweight or obese", and the methods add "After baseline
              studies were completed, participants were randomly assigned to 10
              weeks of treatment with placebo or NMN." The allocation is given:
              "12 were randomized to the placebo group and 13 to the NMN group".
              Randomised and double-blind as recorded. Registry NCT03151239 was
              verified against this same text last pass.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC8550608&retmode=xml
            note: >-
              "Funding: This study was supported by National Institutes of
              Health grants DK56341, DK104995, AG037457, AG047902, the UC San
              Diego IGM Genomics Center utilizing an Illumina NovaSeq 6000 that
              was purchased with funding from a National Institutes of Health
              SIG grant (#S10 OD026929), and support from the Tanaka Fund and
              the Foundation for Barnes-Jewish Hospital." No company appears
              among the funders. The acknowledgments do thank "Oriental Yeast
              Co., Ltd. (Tokyo, Japan) for providing placebo and NMN capsules",
              which is in-kind supply of the tested product rather than funding;
              calling that mixed would be inference, so public was kept. The
              declared interests are real and worth reading — one author
              receives patent-licensing fees relating to NMN and another is
              named on an NMN patent application — but they are author
              interests, not funding. Registry NCT03151239 verified in the full
              text. Europe PMC returns an empty body for this PMC id; NCBI
              efetch serves the full text.
        url: https://doi.org/10.1126/science.abe9985
        species: human
        design: RCT, double-blind
        n: 25
        duration: 10 weeks
        dose: 250 mg NMN/day
        funding: public
        registry: NCT03151239
        outcome: muscle insulin sensitivity (clamp)
        note: >-
          A real but isolated metabolic signal in one small, specific population.
history: []

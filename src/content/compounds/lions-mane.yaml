name: "Lion's mane"
synonyms: [Hericium erinaceus, yamabushitake]
forms: "fruiting-body extract · mycelium powder"
cats: [cognition]
blurb: >-
  A culinary mushroom with genuinely interesting nerve-growth-factor chemistry in
  the dish, and one tiny elderly-cohort trial in people. The gap between those two
  facts is where the marketing lives.
typicalDose: "500–3000 mg extract/day"
studiedDose: "3 g powder/day in the main human trial"
ul: none established
hype: true
reviewed: 2026-08-30
reviewer: "draft — unverified"
claims:
  - outcome: cognition in older adults with mild impairment
    cat: cognition
    grade: C
    effect: small
    species: human-rct
    flags: [under-review]
    studies:
      - cite: Mori et al.
        year: 2009
        checked:
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              Value left unchanged; nothing here verifies it. The full text is
              paywalled at Wiley. Tried and failed: Europe PMC has no PMC copy
              (inEPMC N), Crossref carries no deposited funder record, Unpaywall
              and Semantic Scholar both report no open copy anywhere, and the
              publisher landing page — reachable with a cookie jar, which is
              what gets past Wiley's cookieAbsent redirect — serves only the
              abstract, author affiliations and reference list, with no funding
              or conflict-of-interest section. Do not spend another fetch on
              these routes. Worth a human's attention: four of the five authors
              give their affiliation as the Mushroom Laboratory of Hokuto
              Corporation, a mushroom producer, and the corresponding author is
              one of them. That is an affiliation, not a declared funding
              source, and it is not evidence of who paid for the trial.
        url: https://doi.org/10.1002/ptr.2634
        species: human
        design: RCT, double-blind
        n: 30
        duration: 16 weeks
        dose: 3 g powder/day
        funding: not-declared
        outcome: cognitive function scale (revised HDS-R)
        note: >-
          Scores improved during treatment and declined after stopping — in 30
          people, once, with no independent replication in 15 years.
  - outcome: nerve regeneration
    cat: cognition
    grade: D
    effect: unclear
    species: rodent
    flags: [rodent-only]
    studies:
      - cite: Wong et al.
        year: 2011
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3176599/fullTextXML
            note: >-
              "Funding: University of Malaya for Fundamental Research Grant
              Scheme FP023/2008C and Postgraduate Research Grant PS150/2008B;
              Ministry of Science, Technology and Innovation, Malaysia for
              Science Fund 12-02-03-2050." The acknowledgments separately thank
              two named people "of Vita Agrotech for the continuous supply of
              fresh H. erinaceus mushroom" — in-kind supply of the tested
              material, not funding, and it does not change the value.
        url: https://doi.org/10.1093/ecam/neq062
        species: rodent
        design: controlled animal study, four groups of 10 rats
        n: 40
        duration: 14 days before surgery plus 20 days after
        dose: 10 or 20 mL/kg/day aqueous fruiting-body extract, by mouth
        funding: public
        outcome: peroneal functional index from walking tracks, axon regeneration, motor endplate reinnervation
        note: >-
          Most rats given the extract regained hind-limb function by day 10 after
          the nerve crush and the rest by day 14, against day 14 to 17 in the
          untreated group, and fewer of them showed moderate or severe axonal
          damage at day 14 (2 to 3 of 10, against 8 of 10). Functional recovery
          did not differ between the extract and the mecobalamin positive
          control, though the authors describe mecobalamin's nerve regeneration
          as the more advanced of the two. The two extract doses performed alike.
          Forty rats. Nobody has tested whether lion's mane regenerates nerves in
          humans.
history: []

name: Glycine
synonyms: [aminoacetic acid]
forms: "free amino acid powder"
cats: [sleep, metabolic]
blurb: >-
  The smallest amino acid, cheap and abundant in food. Sold for sleep on a handful
  of small trials, and studied in combination with NAC in older adults.
typicalDose: "3 g before bed"
studiedDose: "3 g/day (sleep trials); 100 mg/kg/day (GlyNAC trials)"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 3000
  studiedMaxMg: 3000
claims:
  - outcome: subjective sleep quality
    cat: sleep
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Yamadera et al.
        year: 2007
        url: https://doi.org/10.1111/j.1479-8425.2007.00262.x
        species: human
        design: RCT, single-blind crossover
        n: 11
        duration: acute (single nights)
        dose: 3 g before bed
        funding: industry
        outcome: polysomnography, subjective sleep quality
        note: >-
          Faster sleep onset and better-rated sleep — in eleven people, funded by
          the amino-acid manufacturer. Cheap enough that nobody has run the big
          trial.
  - outcome: oxidative stress in older adults (with NAC)
    cat: metabolic
    grade: C
    effect: unclear
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Kumar et al.
        year: 2023
        url: https://doi.org/10.1093/gerona/glac135
        species: human
        design: RCT, placebo-controlled (isonitrogenous alanine placebo)
        n: 24
        duration: 16 weeks
        dose: not stated in the abstract
        funding: public
        registry: NCT01870193
        outcome: glutathione concentration, oxidative stress markers, mitochondrial fuel oxidation, inflammation, insulin resistance, gait speed, muscle strength
        note: >-
          Twelve older adults on GlyNAC against twelve on an isonitrogenous
          alanine placebo. Oxidative stress markers and glutathione moved, and so
          did gait speed and strength. Twenty-four people is a very small
          randomised comparison for a claim this broad, and it is a single-centre
          trial. A third group of twelve young adults was studied for two weeks
          as a reference, not as a randomised comparison. Funded by the US
          National Institute on Aging (R01AG041782). The publisher serves only
          the front matter of this paper, so the conflict-of-interest statement
          could not be read.
history: []

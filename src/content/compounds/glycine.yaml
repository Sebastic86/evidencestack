name: Glycine
synonyms: [aminoacetic acid]
forms: "free amino acid powder"
cats: [sleep, metabolic]
blurb: >-
  The smallest amino acid, cheap and abundant in food. Sold for sleep on a handful
  of small trials, and studied in combination with NAC in older adults.
typicalDose: "3 g before bed"
studiedDose: "3 g/day (sleep trials); 100 mg/kg/day (GlyNAC trials)"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 3000
  studiedMaxMg: 3000
claims:
  - outcome: subjective sleep quality
    cat: sleep
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Yamadera et al.
        year: 2007
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://onlinelibrary.wiley.com/doi/10.1111/j.1479-8425.2007.00262.x
            note: >-
              The paper's own methods heading and first sentence: "Study design.
              The study design was a randomized single-blinded crossover trial."
              Randomised, single-blind and crossover, exactly as recorded. Read
              in the complete open-access text, not an abstract. This record was
              checked specifically because a single-blind crossover in eleven
              people is the shape that hid the counterbalanced-not-randomised
              error found in l-theanine/Nawarathna 2025; here the paper does
              claim randomisation in its own words. What it does not report is
              how the sequence was generated or concealed.
          funding:
            on: 2026-08-31
            outcome: corrected
            basis: absence
            source: https://onlinelibrary.wiley.com/doi/10.1111/j.1479-8425.2007.00262.x
            note: >-
              industry → not-declared. The complete text was read this session —
              the article is Open Access under a Creative Commons Attribution
              licence and runs Abstract, Introduction, Methods, Results,
              Discussion, Acknowledgments, References. It contains no funding
              statement and no conflict-of-interest declaration. The entire
              acknowledgment is "The authors express their thanks to Ms Tomoko
              Yagi, and Dr Mitsuo Sasaki, Ohta Memorial Sleep Center, Ohta
              General Hospital, for their support in data collection and
              valuable discussion." A sweep of the whole page for fund, grant,
              conflict, competing, sponsor, financial and disclosure found
              nothing but author affiliations. The previous value of industry
              rested on those affiliations rather than on any sentence in the
              paper. Reaching it needed a cookie jar against Wiley, which
              otherwise redirects to a cookieAbsent wall; earlier passes
              recorded it unreachable.
        url: https://doi.org/10.1111/j.1479-8425.2007.00262.x
        species: human
        design: RCT, single-blind crossover
        n: 11
        duration: acute (single nights)
        dose: 3 g before bed
        funding: not-declared
        outcome: polysomnography, subjective sleep quality
        note: >-
          Faster sleep onset and better-rated sleep, in eleven people. The paper
          carries no funding statement and no conflict-of-interest declaration
          of any kind — which is not the same as stating there was none. Three
          of its six authors, including the corresponding author, work at
          the Research Institute for Health Fundamentals of Ajinomoto Co. Inc.,
          which manufactures amino acids. That is an affiliation, not a declared
          funding source, and the record does not treat it as one. Cheap enough
          that nobody has run the big trial.
  - outcome: oxidative stress in older adults (with NAC)
    cat: metabolic
    grade: C
    effect: unclear
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Kumar et al.
        year: 2023
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: registry
            source: https://clinicaltrials.gov/api/v2/studies/NCT01870193
            note: >-
              The trial's own registry record, NCT01870193 "Glutathione and Fuel
              Oxidation in Aging", gives studyType INTERVENTIONAL, allocation
              RANDOMIZED, interventionModel PARALLEL, and masking QUADRUPLE
              (participant, care provider, investigator, outcomes assessor).
              Randomised and placebo-controlled as recorded, and blinded more
              thoroughly than the record says. The paper's own methods section
              was not read — the publisher releases only front matter to PMC —
              so this rests on the registry, not on the article. One
              discrepancy worth knowing: the registry gives an estimated
              enrolment of 36 against the record's n of 24. That is the split
              TODO 3b already explained (24 randomised, plus 12 young adults
              studied as a non-randomised reference), so it is consistent, but n
              is not this pass's field and was not touched.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: metadata
            source: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=PMC9879756&retmode=xml
            note: >-
              The PMC record's funding group reads "National Institutes of
              Health … National Institute of Aging R01AG041782", and Crossref
              carries the same publisher-deposited funder record. Registry
              NCT01870193 confirmed against the same record. This is deposited
              funding metadata, not a sentence from the paper: the publisher
              releases only front matter to PMC, so the article's own funding
              and conflict-of-interest statements were not read.
        url: https://doi.org/10.1093/gerona/glac135
        species: human
        design: RCT, placebo-controlled (isonitrogenous alanine placebo)
        n: 24
        duration: 16 weeks
        dose: not stated in the abstract
        funding: public
        registry: NCT01870193
        outcome: glutathione concentration, oxidative stress markers, mitochondrial fuel oxidation, inflammation, insulin resistance, gait speed, muscle strength
        note: >-
          Twelve older adults on GlyNAC against twelve on an isonitrogenous
          alanine placebo. Oxidative stress markers and glutathione moved, and so
          did gait speed and strength. Twenty-four people is a very small
          randomised comparison for a claim this broad, and it is a single-centre
          trial. A third group of twelve young adults was studied for two weeks
          as a reference, not as a randomised comparison. Funded by the US
          National Institute on Aging (R01AG041782). The publisher serves only
          the front matter of this paper, so the conflict-of-interest statement
          could not be read.

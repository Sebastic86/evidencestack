name: Glucosamine
synonyms: [glucosamine sulfate, glucosamine hydrochloride]
forms: "sulfate 2KCl · hydrochloride"
cats: [joint, longevity]
blurb: >-
  An amino sugar taken for joints for thirty years. The joint evidence is a mess of
  industry-positive and public-negative trials; meanwhile a huge cohort keeps finding
  users die less often — an association nobody has tested in a trial.
typicalDose: "1500 mg/day"
studiedDose: "1500 mg/day in nearly all trials"
ul: none established
caution: >-
  Made from shellfish; caution with shellfish allergy. May affect glucose tolerance
  at the margins and interacts with warfarin.
hype: false
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 1500
  studiedMaxMg: 1500
claims:
  - outcome: knee osteoarthritis pain
    cat: joint
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded]
    studies:
      - cite: Clegg et al. (GAIT)
        year: 2006
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://escholarship.org/content/qt7zw280cw/qt7zw280cw.pdf
            note: >-
              "Supported by a contract from the National Center for
              Complementary and Alternative Medicine and the National Institute
              of Arthritis and Musculoskeletal and Skin Diseases (NO1AR92236)."
              Read from the published NEJM version deposited in an open
              repository; the NEJM site itself was not used. Registry
              NCT00032890 verified in the paper's own abstract. The paper also
              thanks Ferro Pfanstiehl Laboratories for donating part of the
              glucosamine hydrochloride and Bioiberica for the chondroitin —
              in-kind supply of the tested products, not funding.
        url: https://doi.org/10.1056/NEJMoa052771
        species: human
        design: RCT, double-blind, 5-arm
        n: 1583
        duration: 24 weeks
        dose: 1500 mg HCl/day ± chondroitin
        funding: public
        registry: NCT00032890
        outcome: WOMAC pain response
        note: >-
          The big public trial: no significant benefit over placebo overall. A
          moderate-to-severe-pain subgroup responded — hypothesis, not proof.
      - cite: Towheed et al. (Cochrane)
        year: 2005
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD002946.pub2/information
            note: >-
              Sources of support — "Internal sources: Queens University Cochrane
              Network Site. Kingston, Ontario, Canada. University of Ottawa,
              Canada. External sources: No sources of support supplied." The
              review's own funding is academic. Its Declarations of Interest are
              a separate matter and do disclose industry ties at author level:
              "Rotta Pharmaceuticals (whose product is glucosamine sulfate)
              provided an unrestricted educational grant in support of the
              program" at a symposium the lead author spoke at for an
              honorarium, a co-author holds patents on glucosamine-type
              substances, and another received a Wampole Canada grant for a 1999
              trial. Those are author interests, not funding of this review.
              Note that the funding sections live on the /information tab; the
              /full tab is rendered by script and returns no text.
        url: https://doi.org/10.1002/14651858.CD002946.pub2
        species: human
        design: Cochrane review of 25 RCTs
        n: 4963
        duration: mixed
        dose: mostly 1500 mg sulfate/day
        funding: public
        outcome: pain and function scores
        note: >-
          Benefits concentrate in trials of one manufacturer's sulfate
          preparation; independent trials trend null. The funding column on this
          claim is the story.
  - outcome: lower all-cause mortality (association)
    cat: longevity
    grade: B
    effect: small
    species: observational
    flags: []
    studies:
      - cite: Li et al. (UK Biobank)
        year: 2020
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7286049/fullTextXML
            note: >-
              "Funding: This work was supported by the National Natural Science
              Foundation of China (81973109), the Project Supported by Guangdong
              Province Universities and Colleges Pearl River Scholar Funded
              Scheme (2019), the National Key Research and Development Program
              of China (2018YFC2000400), the Construction of High-level
              University of Guangdong (G619339521 and G618339167) and the
              National Institutes of Health (NIH)/National Institute on Ageing
              (NIA) of USA (P30-AG028716)." The paper also states "Competing
              interests: None declared." No trial registry: this is a cohort
              analysis of UK Biobank under application number 43795.
        url: https://doi.org/10.1136/annrheumdis-2020-217176
        species: human
        design: prospective cohort
        n: 495077
        duration: 8.9 years median
        dose: habitual use (self-report)
        funding: public
        outcome: all-cause and cause-specific mortality
        note: >-
          ~15% lower all-cause mortality in users, surviving adjustment. Consistent
          with other cohorts and a plausible anti-inflammatory mechanism — but
          observational: healthy-user bias can't be excluded and no RCT exists.
history: []

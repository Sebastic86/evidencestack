name: Magnesium
synonyms: [magnesium oxide, magnesium citrate, magnesium glycinate, magnesium bisglycinate, magnesium threonate]
forms: "oxide · citrate · glycinate · malate · taurate · threonate"
cats: [sleep, cardiovascular, metabolic]
blurb: >-
  An essential mineral involved in hundreds of enzyme reactions. The interesting
  questions are about the form — elemental content ranges from ~60% (oxide) down to
  ~7% (threonate) by weight — and about who is actually deficient.
typicalDose: "200–400 mg elemental/day"
studiedDose: "300–600 mg elemental/day in most trials"
ul: "350 mg/day elemental from supplements (food doesn't count)"
caution: >-
  Doses above the supplemental UL commonly cause diarrhea. People with impaired
  kidney function should not supplement without medical supervision.
hype: false
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 300
  studiedMaxMg: 600
  ulMg: 350
claims:
  - outcome: blood pressure reduction
    cat: cardiovascular
    grade: B
    effect: small
    species: human-rct
    flags: []
    studies:
      - cite: Zhang et al.
        year: 2016
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ahajournals.org/doi/pdf/10.1161/HYPERTENSIONAHA.116.07664
            note: >-
              "We identified 34 eligible randomized double-blind
              placebo-controlled trials that included a total of 2028
              normotensive or hypertensive participants", and the discussion
              repeats "In this meta-analysis of 34 randomized double-blind
              placebo-controlled trials involving a total of 2028
              participants". The stated selection criteria are narrower than the
              record claims, in the record's favour: "we conducted a
              comprehensive meta-analysis to synthesize only direct evidence
              from randomized, double-blind, placebo-controlled trials." Trial
              count and design both confirmed. The authors also ran a subgroup
              analysis on "success of randomization", assessed by baseline
              comparability, so randomisation was examined rather than assumed.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ahajournals.org/doi/pdf/10.1161/HYPERTENSIONAHA.116.07664
            note: >-
              "Sources of Funding: The project described was supported by the
              Indiana University Health–Indiana University School of Medicine
              Strategic Research Initiative (Drs Zhang and Song)." followed by
              "Disclosures: None." An institutional academic research
              initiative, with no company named. No registry ID and no
              statement of protocol registration appears anywhere in the paper,
              so no PROSPERO number was added.
        url: https://doi.org/10.1161/HYPERTENSIONAHA.116.07664
        species: human
        design: meta-analysis of 34 RCTs
        n: 2028
        duration: median 3 months
        dose: median 368 mg/day
        funding: public
        outcome: systolic & diastolic blood pressure
        note: >-
          About −2.0 mmHg systolic and −1.8 mmHg diastolic. Real, replicated —
          and small. A textbook case of grade B with a small effect.
  - outcome: sleep quality in older adults with low magnesium
    cat: sleep
    grade: C
    effect: small
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Abbasi et al.
        year: 2012
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3703169/fullTextXML
            note: >-
              "Study design and measurements. The study was performed in a
              double-blind randomized placebo-controlled parallel design, in
              January to March 2012 in Health Divisions of Cultural Centers of
              Tehran's 1, 10, and 14 districts", and the methods add that
              subjects were "randomly allocated into the magnesium or the
              placebo group and received 500 mg elemental magnesium or placebo
              daily for 8 weeks." Randomised and double-blind as recorded, read
              in the complete open-access text. The paper says "Simple sampling
              method was used to select patients" and "Investigators assigned
              consecutive code numbers to participants from a prespecified
              list", which describes selection and coding rather than the
              sequence generation method; allocation concealment is not
              described.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3703169/fullTextXML
            note: >-
              "Source of Support: This study is funded by National Nutrition and
              Food Technology Research Institute of Shahid Beheshti University
              of Medical Sciences", with "Conflict of Interest: None declared."
              This record has no DOI and so is reachable only by PMID: Europe
              PMC EXT_ID:23853635 resolves it to PMC3703169. No trial registry
              ID appears in the full text.
        url: https://pubmed.ncbi.nlm.nih.gov/23853635/
        species: human
        design: RCT, double-blind
        n: 46
        duration: 8 weeks
        dose: 500 mg oxide/day
        funding: public
        outcome: insomnia severity index, sleep efficiency, serum markers
        note: >-
          Better subjective sleep in elderly insomniacs — but n=46 and a
          population likely to be deficient at baseline.
      - cite: Mah & Pitre
        year: 2021
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8053283/fullTextXML
            note: >-
              "Results: Three randomized control trials (RCT) were identified
              comparing oral magnesium to placebo in 151 older adults in three
              countries." Eligibility was "Studies were RCTs of parallel-group
              or cross-over design", and a validated RCT search filter was
              applied. Review type and trial count confirmed. The finding that
              matters most here is one the review states about its own included
              trials: "While all studies were 'double-blind' RCTs, zero studies
              reported methods of randomization sequence, allocation concealment
              or blinding; this placed all studies at some concern for bias."
              So the three pooled trials are called RCTs on their own say-so and
              none documents how it randomised — the same gap, one level down,
              as the counterbalanced-not-randomised error found in
              l-theanine/Nawarathna 2025. The review itself is honest about it;
              the claim above rests on it.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8053283/fullTextXML
            note: >-
              "Funding: The authors have not declared a specific grant for this
              research from any funding agency in the public, commercial or
              not-for-profit sectors.", with "Competing interests: None
              declared." Kept as not-declared rather than none, and the choice
              is arguable: this is a declaration that no specific grant was
              received, which is closer to none than to silence, but it is not
              the flat "no sources of funding were used" that none is for, and
              the acknowledgments do record scholarship support for the primary
              author's graduate studies. Left for a human. The review states its
              own protocol was not registered; CRD42019156594 appears in its
              text but belongs to another group's melatonin review in the
              reference list, so no registry ID was added.
        url: https://doi.org/10.1186/s12906-021-03297-z
        species: human
        design: systematic review of 3 RCTs
        n: 151
        duration: up to 8 weeks
        dose: mixed
        funding: not-declared
        outcome: sleep onset latency, total sleep time
        note: >-
          Small improvement in sleep-onset latency; authors rate the evidence
          quality as low. This is why the claim sits at C, not B.
  - outcome: migraine prophylaxis
    cat: other
    grade: B
    effect: small
    species: human-rct
    flags: []
    studies:
      - cite: Peikert et al.
        year: 1996
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://journals.sagepub.com/doi/10.1046/j.1468-2982.1996.1604257.x
            note: >-
              The paper describes its own design in its title: "Prophylaxis of
              Migraine with Oral Magnesium: Results From A Prospective,
              Multi-Center, Placebo-Controlled and Double-Blind Randomized
              Study." Randomised and double-blind as recorded. This is the
              weakest design confirmation in these seven files and should be
              read as such: the evidence is the title and the abstract, because
              the full text is behind SAGE's "Restricted access" and could not
              be read. The abstract body does not itself use the word
              randomised, and nothing about sequence generation, allocation
              concealment or who was blinded is known. Funding for the same
              paper remains unreachable.
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              Value left unchanged; nothing here verifies it. Tried and failed:
              Europe PMC has no PMC copy (inEPMC N), Crossref carries no
              deposited funder record, Unpaywall and Semantic Scholar both
              report no open copy, PubMed holds no conflict-of-interest
              statement for this record, and the SAGE landing page the DOI now
              resolves to is marked "Restricted access" and serves the abstract
              only. A 1996 trial predates routine funding statements, so a
              reachable full text might still declare nothing. Do not spend
              another fetch on these routes.
        url: https://doi.org/10.1046/j.1468-2982.1996.1604257.x
        species: human
        design: RCT, double-blind
        n: 81
        duration: 12 weeks
        dose: 600 mg citrate/day
        funding: not-declared
        outcome: migraine attack frequency
        note: >-
          Attack frequency fell ~42% vs ~16% on placebo. Enough for several
          neurology guidelines to list magnesium as probably effective.
  - outcome: glycemic control in type 2 diabetes
    cat: metabolic
    grade: C
    effect: small
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Simental-Mendía et al.
        year: 2016
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:27329332&resultType=core&format=json
            note: >-
              Confirms the study type only, not the count, and the difference
              matters. The paper's own title is "A systematic review and
              meta-analysis of randomized controlled trials on the effects of
              magnesium supplementation on insulin sensitivity and glucose
              control", and the abstract says it searched four databases "to
              identify RCTs evaluating the effect of magnesium on insulin
              sensitivity and glucose control". So it is a meta-analysis of
              RCTs. The figure 18 appears in no source anyone has retrieved:
              the abstract instead reports that the effect "was assessed in 22,
              14, 12 and 10 treatment arms" for glucose, HbA1c, insulin and
              HOMA-IR respectively, which are per-outcome arm counts and not a
              single trial total. The design string was left unchanged because
              18 is unverified rather than contradicted, and deleting it would
              be a change made on absence. The full text is closed — routes
              exhausted are Europe PMC, NCBI efetch, Crossref, OpenAlex,
              Unpaywall, Semantic Scholar, Elsevier by both linkinghub and
              ScienceDirect (403), the University of Western Australia
              repository, and the Wayback Machine, whose only snapshots are
              linkinghub redirect stubs. TODO 3d's flag on this record's n and
              duration stands unresolved.
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              Value left unchanged; nothing here verifies it. The corrected DOI
              resolves to the right paper, but the paper is fully closed. Tried
              and failed: Europe PMC has no PMC copy (inEPMC N), Crossref
              carries no deposited funder record, OpenAlex reports oa_status
              closed with no repository full text, Elsevier returns 403 to both
              the linkinghub and ScienceDirect routes, and the University of
              Western Australia repository record is metadata only. Do not spend
              another fetch on these routes. Separately flagged for item 1 and
              not touched here: this record's design, n and duration appear
              nowhere in the retrievable abstract, and the note below reports
              improvement in fasting glucose where the abstract reports it null
              overall.
        url: https://doi.org/10.1016/j.phrs.2016.06.019
        species: human
        design: meta-analysis of 18 RCTs
        n: 670
        duration: 4–24 weeks
        dose: mixed
        funding: not-declared
        outcome: fasting glucose, insulin sensitivity indices
        note: >-
          Improvements in fasting glucose in deficient or diabetic participants —
          surrogate markers only, and heterogeneous trials.
history:
  - date: "2026-01"
    claim: sleep quality in older adults with low magnesium
    from: B
    to: C
    why: >-
      Re-review against the 2021 systematic review's low quality rating; the
      original B leaned too heavily on one small trial.

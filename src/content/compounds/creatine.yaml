name: Creatine
synonyms: [creatine monohydrate, creatine HCl]
forms: "monohydrate · HCl · buffered"
cats: [muscle, cognition]
blurb: >-
  A compound your body makes and stores in muscle to regenerate ATP during short,
  intense effort. The most-studied sports supplement in existence — which makes it
  a good showcase for why grades are per claim, not per compound.
typicalDose: "3–5 g/day (monohydrate)"
studiedDose: "3–5 g/day maintenance; 20 g/day short loading phases"
ul: none established
caution: >-
  Expect 1–2 kg of water-weight gain in the first weeks. People with kidney disease
  should talk to their doctor before supplementing.
hype: true
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 3000
  studiedMaxMg: 5000
claims:
  - outcome: muscle mass & strength with resistance training
    cat: muscle
    grade: A
    effect: moderate
    species: human-rct
    flags: []
    studies:
      - cite: Chilibeck et al.
        year: 2017
        url: https://doi.org/10.2147/OAJSM.S123529
        species: human
        design: meta-analysis of 22 RCTs
        n: 721
        duration: 7–52 weeks
        dose: "3–5 g/day + resistance training"
        funding: not-declared
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5679696/fullTextXML
            note: >-
              Full text read: "We conducted a systematic review and meta-analysis
              of randomized controlled trials of creatine supplementation during
              resistance training in older adults… Twenty-two studies were
              included in our meta-analysis with 721 participants." Count, design
              and n all match the record.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: absence
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5679696/fullTextXML
            note: >-
              Full text read end to end. It carries no funding statement at all:
              a search of the whole document returns zero occurrences of
              "funding", "acknowledg", "grant", "supported by" or "financial".
              The only back-matter declaration is "The authors report no
              conflicts of interest in this work", which is a conflicts
              statement, not a funding one. Crossref and Europe PMC deposit no
              funder either. The paper is genuinely silent, which is what
              not-declared means.
        outcome: lean tissue mass, upper/lower-body strength
        note: >-
          Older adults gained ~1.4 kg more lean mass with creatine than with
          resistance training alone. Consistent direction across trials.
      - cite: Lanhers et al.
        year: 2017
        url: https://doi.org/10.1007/s40279-016-0571-4
        species: human
        design: meta-analysis of RCTs
        n: 266
        duration: 4–12 weeks
        dose: "2–25 g/day"
        funding: none
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:27328852&resultType=core&format=json"
            note: >-
              Abstract Methods: "We conducted a systematic review and
              meta-analyses of all randomized controlled trials comparing
              creatine supplementation with a placebo, with strength performance
              measured in exercises shorter than 3 min in duration." The pooled
              studies are stated to be randomised, so the design string holds.
              Unresolved and outside this pass: the same abstract reports "We
              included 53 studies (563 individuals in the creatine
              supplementation group and 575 controls)", which does not obviously
              reconcile with this record's n of 266.
          funding:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: https://link.springer.com/article/10.1007/s40279-016-0571-4
            note: >-
              Ethics declarations read on the publisher's article page:
              "Funding: No sources of funding were used to assist in the
              preparation of this article", alongside a statement that all six
              authors "declare that they have no conflicts of interest relevant
              to the content of this review." Corrected not-declared → none: the
              authors state outright that nobody funded this, which is a
              different fact from the paper being silent. An explicitly unfunded
              independent meta-analysis is the strongest funding provenance in
              this file.
        outcome: upper-limb maximal strength
        note: >-
          Strength gains replicated across independent labs and populations; the
          companion 2015 analysis found the same for lower-limb strength.
      - cite: Branch
        year: 2003
        url: https://doi.org/10.1123/ijsnem.13.2.198
        species: human
        design: meta-analysis of 100 randomized, placebo-controlled studies
        n: 1847
        duration: mixed
        dose: mostly 20 g load then 2–5 g/day
        funding: not-declared
        checked:
          design:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:12945830&resultType=core&format=json"
            note: >-
              Corrected "meta-analysis of 100 studies" → "meta-analysis of 100
              randomized, placebo-controlled studies". Abstract Methods: "A
              search of MEDLINE and SPORTDiscus using the phrase 'creatine
              supplementation' revealed 96 English-language, peer-reviewed papers
              (100 studies), which included randomized group formation, a placebo
              control, and human subjects who were blinded to treatments." The
              old string named a count without saying the pooled studies were
              randomised, so it did not support the claim's human-rct label on
              its face. The source does. The full text remains paywalled; this is
              the abstract's own Methods sentence.
          funding:
            on: 2026-08-31
            outcome: unreachable
            note: >-
              No funding statement reached, so the existing value stands
              unverified. Unpaywall, Semantic Scholar and OpenAlex all report
              closed with no open copy; the Human Kinetics article page serves
              no text; there is no PubMed Central record; Crossref deposits no
              funder. Whether the paper carries a funding statement at all is
              unknown — nobody has been able to look.
        outcome: body composition & performance effect sizes
        note: >-
          Early quantitative summary; effect sizes largest for short, repeated
          high-intensity work and lean body mass.
  - outcome: cognition in healthy adults
    cat: cognition
    grade: C
    effect: unclear
    species: human-rct
    flags: [under-review]
    studies:
      - cite: Avgerinos et al.
        year: 2018
        url: https://doi.org/10.1016/j.exger.2018.04.013
        species: human
        design: systematic review of 6 RCTs
        n: 281
        duration: 5 days – 6 weeks
        dose: "5–20 g/day"
        funding: public
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=6093191&retmode=xml"
            note: >-
              Full text read. Title: "Effects of creatine supplementation on
              cognitive function of healthy individuals: A systematic review of
              randomized controlled trials", six studies included. The record's
              string is right, but one of the six is Rae 2003, which this review
              labels "One study was a 'cross-over' RCT (Rae et al., 2003)" while
              Rae's own paper never states that anyone was randomised — see the
              Rae record below. So this review's count of six randomised trials
              is itself likely one too many, on the primary sources.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: metadata
            source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:29704637&resultType=core&format=json"
            note: >-
              This is the weakest public value in the register and should be
              read as such. The full text was retrieved and read via NCBI
              efetch (PMC6093191) and it contains no funding statement, no
              acknowledgements and no conflict-of-interest section anywhere.
              Crossref and OpenAlex deposit no funder. The value rests entirely
              on a single NLM-side grant linkage in Europe PMC's record — two
              Intramural NIH awards, Z99 AG999999 and ZIA AG000975 — which is a
              cataloguing association, not something the authors declared.
        outcome: memory, reasoning, reaction-time test batteries
        note: >-
          Short-term memory and intelligence/reasoning may improve; other domains
          inconsistent. Trials are small and short — this is why the grade is C
          despite the hype.
      - cite: Rae et al.
        year: 2003
        url: https://doi.org/10.1098/rspb.2003.2492
        species: human
        design: double-blind, placebo-controlled crossover
        n: 45
        duration: 6 weeks
        dose: 5 g/day
        funding: public
        checked:
          design:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: "https://web.archive.org/web/20191026210524id_/https://royalsocietypublishing.org/doi/pdf/10.1098/rspb.2003.2492"
            note: >-
              Corrected "RCT, double-blind crossover" → "double-blind,
              placebo-controlled crossover". The paper never claims
              randomisation. Its Study design section reads in full: "The study
              followed a double-blind, placebo-controlled, cross-over design.
              Subjects were seen on four separate occasions, at six-week
              intervals" — and that is the whole of it. Across the complete text
              the word "random" occurs once, about something else entirely
              ("Blood glucose levels were measured randomly, by finger prick");
              "allocated", "counterbalanced", "Latin square" and "washout" do not
              appear at all, and "assigned" appears only of test versions. Two
              treatment orders existed, since the analysis reports an effect of
              treatment order, but how subjects reached them is never stated.
              This is the same shape as the l-theanine defect. Recovered from the
              publisher's own archived PDF after Europe PMC, NCBI efetch and the
              archived HTML all failed — PubMed Central holds page scans only.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://web.archive.org/web/20191026210524id_/https://royalsocietypublishing.org/doi/pdf/10.1098/rspb.2003.2492"
            note: >-
              Funding sentence read in the paper: "This work was supported by
              the Australian National Health and Medical Research Council" — a
              government research council, so public is correct. It is easy to
              miss: there is no acknowledgements section and no
              conflict-of-interest section, and the sentence sits unlabelled as
              the last line of the Discussion, immediately before the references.
              The words "funding", "grant" and "acknowledg" appear nowhere in the
              paper. Previously recorded as unreachable, and the routes that
              failed are worth keeping: PubMed Central holds this paper as
              scanned page images only — its record states "The publisher of this
              article does not allow downloading of the full text in XML form" —
              the Royal Society's live site returns 403, the archived HTML is a
              login wall, and Crossref and OpenAlex deposit no funder. What
              worked was the publisher's own archived PDF via the Wayback
              Machine.
        outcome: working memory & processing speed in vegetarians
        note: >-
          Positive — but in vegetarians, who start with low creatine stores.
          Doesn't generalise to omnivores without more data.
  - outcome: depression, as an adjunct to SSRIs
    cat: cognition
    grade: C
    effect: small
    species: human-rct
    flags: []
    studies:
      - cite: Lyoo et al.
        year: 2012
        url: https://doi.org/10.1176/appi.ajp.2012.12010009
        species: human
        design: RCT, double-blind
        n: 52
        duration: 8 weeks
        dose: 5 g/day + escitalopram
        funding: public
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=4624319&retmode=xml"
            note: >-
              Full text read. Study Design and Procedures: "The enrolled subjects
              were randomly assigned in a 1:1 ratio to receive escitalopram plus
              creatine supplementation (the creatine group) or escitalopram plus
              placebo (the placebo group) according to a randomization log." The
              abstract and title say the same. Randomisation is stated with its
              mechanism, and the trial is registered as NCT00729755.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=4624319&retmode=xml"
            note: >-
              Funding statement read in full text: "This study was supported by
              an independent investigator award from NARSAD…, grant 2011K000273
              from the Brain Research Center of the 21st Century Frontier
              Research Program…, grant KRF-2008-220-E00021 from the Global
              Research Network Program, the Korea Research Foundation…, the
              Mental Illness Research, Education and Clinical Center of Veterans
              Integrated Service Network 19…, National Institute on Drug Abuse
              grants DA-015116 and DA-031247… and DA-024070…, and NIMH grant
              MH-058681", followed by "The sponsors of the study had no role in
              the study design and conduct of the study." A senior author
              declares industry consultancies separately, but no company funded
              this trial. Registry ownership was checked against the
              ClinicalTrials.gov API: NCT00729755 is "Creatine Augmentation
              Treatment in Major Depressive Disorder Subjects" (Ewha Womans
              University), which is this study.
        registry: NCT00729755
        outcome: depression rating scale (HDRS)
        note: >-
          Faster and larger symptom improvement in women with major depression.
          One trial, one population — needs replication before this moves.
  - outcome: bone mineral density in older adults
    cat: muscle
    grade: E
    effect: negligible
    species: human-rct
    flags: []
    studies:
      - cite: Chilibeck et al.
        year: 2023
        url: https://doi.org/10.1249/mss.0000000000003202
        species: human
        design: RCT, double-blind, 2-year
        n: 237
        duration: 104 weeks
        dose: "0.14 g/kg/day + exercise"
        funding: public
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10487398/fullTextXML
            note: >-
              Full text read. Methods, Study design: "The study used a
              randomized, double-blind, placebo-controlled, parallel-group,
              repeated measures design at two centers: the University of
              Saskatchewan and University of Regina. Participants were randomized
              using a computer-generated allocation schedule to one of two groups
              (on a 1/1 ratio) for a 2-yr intervention." Randomisation, blinding
              and duration all match the record, and the mechanism is named.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10487398/fullTextXML
            note: >-
              Acknowledgements read in full text: "The study received funding
              from the Canadian Institutes of Health Research (funding reference
              number: 130235) and the Canada Foundation for Innovation." The
              same paragraph declares that an author "has conducted
              industry-sponsored research involving creatine supplementation"
              and "serves on the Scientific Advisory Board for Alzchem (a
              company that manufactures creatine)" — a competing interest, not a
              funder of this trial. Registry ownership was checked against the
              ClinicalTrials.gov API: NCT02047864 is "Effect of Creatine
              Supplementation and Exercise on Bone Health" (University of
              Saskatchewan, enrolment 237), which is this study.
        registry: NCT02047864
        outcome: DXA bone mineral density, postmenopausal women
        note: >-
          The long, well-powered trial the field was waiting for: no effect on
          bone density. Earlier small positive signals didn't replicate.
history:
  - date: "2026-05"
    claim: bone mineral density in older adults
    from: C
    to: E
    why: >-
      Two-year RCT in 237 postmenopausal women found no effect on bone density,
      overriding earlier small mixed trials.

name: Rapamycin
synonyms: [sirolimus, mTOR inhibitor]
forms: "prescription drug — reference entry, not a supplement"
cats: [longevity]
blurb: >-
  A prescription immunosuppressant and the most robust lifespan-extending
  intervention in mammals to date. Included as a reference point: this is what
  strong animal longevity evidence actually looks like — and it still isn't a
  supplement.
typicalDose: "not applicable — prescription only"
studiedDose: "longevity dosing in humans is experimental (off-label, typically weekly)"
ul: not applicable
caution: >-
  An immunosuppressant with real side effects (infections, metabolic changes,
  impaired wound healing). Off-label longevity use is self-experimentation under
  medical supervision, not supplementation.
reviewed: 2026-08-30
reviewer: "draft — unverified"
claims:
  - outcome: lifespan extension
    cat: longevity
    grade: D
    effect: large
    species: rodent
    flags: [rodent-only]
    studies:
      - cite: Harrison et al. (NIA ITP)
        year: 2009
        url: https://doi.org/10.1038/nature08221
        species: rodent
        design: multi-site controlled lifespan study
        n: 1901
        duration: from 20 months of age to death
        dose: 14 ppm in feed
        funding: public
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=2786175&retmode=xml'
            note: >-
              Acknowledgements: "This work was supported by NIA grants AG022303
              (RAM), AG025707 and AG022308 (DEH), and AG022307 and AG13319 (RS),
              and the Department of Veterans Affairs (RAM and RS)." All
              government. Europe PMC's fullTextXML 404s for this PMCID; NCBI
              efetch returns the body.
        outcome: lifespan in genetically heterogeneous mice
        note: >-
          9–14% median lifespan extension, started late in life, replicated
          across three sites and many follow-ups. The best animal longevity
          result there is — and still grade D, because no human lifespan data
          exists or is likely soon.
  - outcome: improved vaccine response in older adults (low-dose mTOR inhibition)
    cat: longevity
    grade: C
    effect: small
    species: human-rct
    flags: [industry-funded, biomarker-only]
    studies:
      - cite: Mannick et al.
        year: 2014
        url: https://doi.org/10.1126/scitranslmed.3009892
        species: human
        design: RCT, observer-blind, placebo-controlled (everolimus)
        n: 218
        duration: 6 weeks
        dose: 0.5 mg/day – 5 mg/week everolimus
        funding: industry
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: 'https://health.uconn.edu/aging/wp-content/uploads/sites/6/2016/04/mTOR-inhibition-improves-immune-function-in-the-elderly.pdf'
            note: >-
              "Funding: Supported by Novartis Institutes for BioMedical
              Research." Novartis developed RAD001, the tested compound, so this
              is the manufacturer funding a trial of its own product. Read from a
              complete copy of the published paper hosted by the University of
              Connecticut Center on Aging, after Science Translational Medicine
              itself refused every route — not in PMC, no PMCID, Unpaywall and
              Semantic Scholar both report it closed, Crossref holds no funder
              record, science.org 403s, and the archived abstract and .full pages
              both stop at the paywall before the back matter. Identity checked
              before use: DOI 10.1126/scitranslmed.3009892, Sci. Transl. Med. 6,
              268ra179 (2014), and the trial's 218 subjects, 6-week treatment and
              0.5 mg daily / 5 mg weekly / 20 mg weekly arms all match this
              record. Corroborating and consistent, though not the basis for the
              value: nine of twelve authors give a Novartis affiliation and the
              corresponding address is joan.mannick@novartis.com.
          registry:
            on: 2026-08-31
            outcome: confirmed
            basis: absence
            source: 'https://health.uconn.edu/aging/wp-content/uploads/sites/6/2016/04/mTOR-inhibition-improves-immune-function-in-the-elderly.pdf'
            note: >-
              No registration, verified against the complete full text rather
              than merely not found: a regex sweep of the extracted text for NCT,
              ACTRN, ISRCTN, EudraCT and UMIN identifiers returns nothing, and the
              paper carries no trial-registration section. Registry searches also
              came back empty — ClinicalTrials.gov (five queries covering RAD001,
              everolimus, immunosenescence and vaccination in the elderly), the EU
              Clinical Trials Register, and the WHO ICTRP portal. One gap remains
              honest: ANZCTR could not be searched directly, its results loading
              through a postback that could not be driven, and the trial ran in
              New Zealand and Australia. So "no registration exists" is strongly
              evidenced but not absolutely closed. The previously removed
              NCT01190800 — which belongs to an unrelated Alzheimer's study —
              stays removed.
          design:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: 'https://health.uconn.edu/aging/wp-content/uploads/sites/6/2016/04/mTOR-inhibition-improves-immune-function-in-the-elderly.pdf'
            note: >-
              Was "RCT, double-blind". Randomised is right; double-blind is not,
              and the paper says so itself. Study design: "From December 2011 to
              April 2012, 218 elderly volunteers ≥65 years of age without
              unstable underlying medical diseases were enrolled in a randomized,
              observer-blind, placebo-controlled trial at nine sites in New
              Zealand and Australia." Allocation: "The subjects were randomized
              to treatment arms, using a validated automated randomization system
              with a ratio of RAD001 to placebo of 5:2 in each treatment arm."
              And the blinding, explicitly: "The trial was observer-blind because
              the placebo in the RAD001 0.5 mg daily and 20 mg weekly cohorts
              differed slightly from the RAD001 tablets in those cohorts. The
              study personnel evaluating the subjects did not see the study
              medication and therefore were fully blinded." So assessors were
              blinded and participants were not — the phrase "double-blind"
              appears nowhere in the paper. Reached through a copy of the
              published PDF hosted by the University of Connecticut Center on
              Aging after the publisher, PMC and the archived publisher pages all
              failed; identity checked against the record before use — DOI
              10.1126/scitranslmed.3009892, Sci. Transl. Med. 6, 268ra179 (2014),
              all twelve authors, and the trial's own 218 subjects, 6-week
              treatment and 0.5 mg daily / 5 mg weekly / 20 mg weekly arms all
              match this record's n, duration and dose.
        outcome: influenza vaccine antibody titers
        note: >-
          ~20% better vaccine response at low doses — the closest thing to a
          human "aging" endpoint for this pathway, using a related drug.

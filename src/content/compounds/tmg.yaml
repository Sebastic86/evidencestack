name: TMG
synonyms: [trimethylglycine, betaine, betaine anhydrous]
forms: "betaine anhydrous"
cats: [metabolic, muscle]
blurb: >-
  A methyl donor often stacked with NAD+ precursors "to support methylation." What
  it demonstrably does is lower homocysteine; the rest is extrapolation.
typicalDose: "500–2000 mg/day"
studiedDose: "2–6 g/day (homocysteine trials)"
ul: none established
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 2000
  studiedMaxMg: 6000
claims:
  - outcome: homocysteine lowering
    cat: metabolic
    grade: B
    effect: moderate
    species: human-rct
    flags: [biomarker-only]
    studies:
      - cite: Olthof et al.
        year: 2003
        url: https://doi.org/10.1093/jn/133.12.4135
        species: human
        design: RCT, double-blind
        n: 76
        duration: 6 weeks
        dose: 1.5–6 g/day
        funding: mixed
        checked:
          funding:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: 'https://web.archive.org/web/20191228212052id_/https://academic.oup.com/jn/article/133/12/4135/4687457'
            note: >-
              Was public. The corrected DOI resolves, and the article's own
              footnote 2 reads "Funded by the Wageningen Centre for Food
              Sciences, an alliance of major Dutch food industries, University of
              Maastricht, TNO Nutrition and Food Research, and Wageningen
              University and Research Centre, with financial support by the Dutch
              government." A public-private consortium that names the food
              industry as a constituent funder alongside government money is
              mixed, not public. Reached through an archived copy of the Oxford
              Academic page; the live publisher pages (OUP, ScienceDirect) both
              403, which is why the earlier pass recorded this as unreachable.
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: 'https://web.archive.org/web/20191228212052id_/https://academic.oup.com/jn/article/133/12/4135/4687457'
            note: >-
              Genuinely randomised, and parallel rather than crossover: subjects were
              stratified "by gender, plasma homocysteine concentration, blood pressure
              and smoking (yes or no), then randomly assigned to one of four treatment
              groups (n = 19 per group)", in what the paper calls a "double-blind
              placebo-controlled intervention study". The four arms were 1.5, 3 or 6
              g/d of betaine, or placebo.
        outcome: plasma homocysteine
        note: >-
          Dose-dependent ~10–20% reduction, well replicated. Whether lowering
          homocysteine this way prevents anything is a different, unproven claim.
  - outcome: strength & power performance
    cat: muscle
    grade: C
    effect: unclear
    species: human-rct
    flags: []
    studies:
      - cite: Zawieja et al.
        year: 2024
        url: https://doi.org/10.1080/02640414.2024.2423578
        species: human
        design: systematic review and meta-analysis of 17 double-blind placebo-controlled trials (15 randomised, 2 unstated)
        n: 317
        duration: at least 7 days of chronic supplementation
        dose: not stated in the abstract
        funding: none
        checked:
          funding:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: 'https://web.archive.org/web/20250531142805id_/https://www.tandfonline.com/doi/full/10.1080/02640414.2024.2423578'
            note: >-
              Was not-declared, which under-reported it. The paper does declare,
              and what it declares is nothing: "Funding: The author(s) reported
              there is no funding associated with the work featured in this
              article." The disclosure statement adds "No potential conflict of
              interest was reported by the author(s)." An explicitly unfunded
              independent meta-analysis is a different fact from silence, so this
              is the first use of funding: none. Reached through an archived copy
              of the Taylor & Francis page; the live page 403s, which is why the
              record's own note still says funding could not be verified past the
              abstract. That sentence is now stale. The archived copy carries the
              abstract and the end matter but not the methods, so the absence of
              a PROSPERO registration could not be confirmed either way and none
              was added.
          design:
            on: 2026-08-31
            outcome: corrected
            basis: statement
            source: 'https://www.fisiologiadelejercicio.com/wp-content/uploads/2024/11/Effects-of-chronic-betaine-supplementation-on.pdf'
            note: >-
              Was "17 RCTs", which overstated it, though not by much. The full text
              was reached on a second attempt and says: "Of these, two studies do not
              clearly state whether they were randomized (Yang et al., 2020, 2022)
              while 15 were randomized clinical trials. All the chosen studies
              followed a double-blinded and placebo-controlled approach. Eight
              studies utilized a cross-over design, while the remaining nine employed
              parallel groups." So 15 of the 17 are randomised, two are not stated
              either way, and every one was double-blind and placebo-controlled — the
              blinding was the part the record never mentioned. The eligibility table
              asked for "Clinical trials with parallel and crossover design", and
              crossovers needed "at least a 2-week washout period". Also worth
              knowing, and not a design matter: "Sixteen studies were published in
              peer-reviewed journals, while one study was a master's thesis (Apicella,
              2011)", and the trials are small — "sample sizes varied, ranging from 10
              to 43 participants … with a median of 17". Reached through a copy of the
              published PDF hosted by fisiologiadelejercicio.com after Taylor &
              Francis, Unpaywall, OpenAlex and Semantic Scholar all failed; the file
              carries the correct DOI, title and author list, and two sentences of its
              abstract match the Europe PMC record word for word, which is how the
              copy was checked before use.
        outcome: maximal strength, sprint and throw power, muscular endurance, vertical jump
        note: >-
          Splits the claim in two. Maximal strength improved (SMD 0.47), driven
          almost entirely by the lower body, and the confidence interval nearly
          touches zero. Power did not: no effect on cycling sprint power, bench
          press throw power, upper body strength or muscular endurance. Vertical
          jump improved only after a low-quality study was removed. 317 people
          across 17 trials, 21% of them female. The end matter has since been
          read, through an archived copy of the publisher's own page, and the
          authors state outright that "there is no funding associated with the
          work featured in this article" and that no conflict of interest was
          reported. That is a declaration of having received nothing, not
          silence about the question, which is what the funding field on this
          record now records. The archived copy carries the abstract and the end
          matter but not the methods, so whether this review was registered in
          advance is still unknown.
history: []

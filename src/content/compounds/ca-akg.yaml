name: Ca-AKG
synonyms: [calcium alpha-ketoglutarate, alpha-ketoglutarate, AKG]
forms: "calcium alpha-ketoglutarate"
cats: [longevity]
blurb: >-
  A Krebs-cycle intermediate whose levels decline with age, sold as a longevity
  supplement on the strength of a striking mouse study. The human evidence so far is
  one small, industry-run trial measuring a methylation clock.
typicalDose: "1–2 g/day"
studiedDose: "1 g/day in the human trial; ~510 mg/kg/day in mice"
ul: none established
hype: true
reviewed: 2026-08-30
reviewer: "draft — unverified"
doseGuide:
  studiedMinMg: 1000
  studiedMaxMg: 2000
claims:
  - outcome: slower biological aging (methylation clocks)
    cat: longevity
    grade: C
    effect: unclear
    # Not human-rct, and not human-trial either: nobody assigned treatment.
    # Demidenko 2021 is a retrospective review of 42 people who had elected to
    # buy the product, with no control group and no blinding. Allocation was
    # self-selection by purchase, which makes it observational.
    species: observational
    flags: [industry-funded, biomarker-only, under-review]
    studies:
      - cite: Demidenko et al.
        year: 2021
        url: https://doi.org/10.18632/aging.203736
        species: human
        design: retrospective, single-arm
        n: 42
        duration: ~7 months average
        dose: 1 g/day (Rejuvant)
        funding: industry
        checked:
          design:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8660611/fullTextXML
            note: >-
              The design field is correct and the claim above it is not. Abstract:
              "Herein we report a retrospective analysis of DNA methylation age in
              42 individuals taking Rejuvant®… for an average period of 7 months."
              Results: "we reviewed 42 participants who had elected to take
              Rejuvant®." Participants self-selected by buying the product; nobody
              assigned treatment, there is no control group and no blinding. The
              authors say so themselves: "While continued testing, particularly in
              a placebo-controlled design, is required…" This is not randomised,
              not controlled, and not even interventional — the claim's
              species: human-rct is unsupported and needs a human decision.
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8660611/fullTextXML
            note: >-
              Funding statement read in full text: "Data for the manuscript was
              acquired from users of the Rejuvant product from Ponce de Leon
              Health and DNA methylation analysis provided by TruMe Labs. Data
              was provided to National University of Singapore for statistical
              analysis, which provided funding support for this component of the
              project." The named public body is the authors' own institution
              covering its statisticians on one component; everything that
              resourced the study — all the data, the assay — came from the two
              companies. Kept at industry on that reading. The competing-
              interests statement adds that a co-author "is a scientific
              consultant and Board member for Ponce de Leon Health."
        outcome: TruAge DNA-methylation age
        note: >-
          Reported ~8 years of methylation-age reduction — with no control group,
          run by the product's seller, on a proprietary clock. This is the study
          that moved the grade from D to C, and every flag on it matters.
  - outcome: healthspan & lifespan extension
    cat: longevity
    grade: D
    effect: moderate
    species: rodent
    flags: [rodent-only]
    studies:
      - cite: Asadi Shahmirzadi et al.
        year: 2020
        url: https://doi.org/10.1016/j.cmet.2020.08.004
        species: rodent
        design: controlled lifespan study
        n: 182
        duration: from 18 months of age to death
        dose: 2% of chow (Ca-AKG)
        funding: mixed
        checked:
          funding:
            on: 2026-08-31
            outcome: confirmed
            basis: statement
            source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=8508957&retmode=xml"
            note: >-
              Acknowledgements read in full text: "This work was supported by
              The Weldon Foundation and by Ponce de Leon Health. This work was
              also supported by NIH grant U01AG045844 (G.J.L.), NIA grant
              R01AG051729, grant support from the Larry L. Hillblom Foundation,
              and the Navigage Foundation." Industry money alongside real
              external public grants, so mixed is earned here. The declaration
              of interests is stronger than the field conveys: Ponce de Leon
              Health sells the tested compound, four authors hold shares in it
              and one is a board member. Europe PMC reports this paper as
              in-database but 404s on its full text; NCBI efetch served it.
        outcome: median lifespan, frailty index in mice
        note: >-
          ~12% longer median lifespan in females and large frailty reductions in
          both sexes, started late in life. Impressive — and entirely murine.
          Nobody has tested this endpoint in humans.
history:
  - date: "2026-03"
    claim: slower biological aging (methylation clocks)
    from: D
    to: C
    why: >-
      First human data appeared (Demidenko 2021 reassessed against our rubric):
      human, but uncontrolled, industry-run, and biomarker-only — enough for C,
      nowhere near B.
